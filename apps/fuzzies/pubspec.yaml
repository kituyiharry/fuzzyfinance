name: fuzzies
description: FuzzyFinance mobile companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true
