name = "zincserver"
compatibility_date = "2026-04-17"
main = "src/worker.js"

# Cloudflare Container — runs the MiniZinc server Docker image.
# The Worker (src/worker.js) proxies incoming requests to the container.
# Ref: https://developers.cloudflare.com/containers/
[[containers]]
class_name = "ZincServer"
image = "."
max_instances = 3
