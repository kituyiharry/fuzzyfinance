[package]
name = "orsolver-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orsolver-server"
path = "src/main.rs"

[dependencies]
orsolver   = { workspace = true }
axum       = "0.8"
tokio      = { version = "1", features = ["full"] }
tower      = "0.5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
