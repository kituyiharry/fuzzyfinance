[workspace]
resolver = "2"
members = ["orsolver-sys", "orsolver", "orsolver-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
orsolver-sys = { path = "orsolver-sys" }
orsolver     = { path = "orsolver" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
