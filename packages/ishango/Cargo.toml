[package]
name = "ishango"
version = "0.1.0"
edition = "2021"

[lib]
name = "ishango"
path = "src/lib.rs"

[[bin]]
name = "ishango"
path = "src/bin/ishango.rs"

[features]
# Rich line-editing REPL (history, paren matching, tab completion). Default
# on so `cargo install` ships a friendly binary. Library code is unaffected
# either way — every rustyline reference is gated to the `ishango` bin.
# Disable with `--no-default-features` for wasm / minimal lib builds.
default = ["repl"]
repl    = ["dep:rustyline"]

[dependencies]
thiserror = "1"
rustyline = { version = "14", optional = true }

# Hand-rolled timing benchmarks. No external bench crate so the workspace
# stays buildable without network. Invoke with `cargo bench -p ishango`.
[[bench]]
name    = "core"
harness = false
