[package]
name = "alloy"
version = "0.1.0"
edition = "2024"
description = "Safe Rust bindings to the libminizinc constraint solver C++ library"
autobins = false

[lib]
name = "alloy"
path = "src/lib.rs"

[dependencies]
alloy-sys = { path = "../alloy-sys" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
