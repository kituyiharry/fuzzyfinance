[package]
name = "alloy-server"
version = "0.1.0"
edition = "2024"
description = "HTTP server exposing the MiniZinc solver via a JSON API"

[[bin]]
name = "alloy"
path = "src/main.rs"

[dependencies]
alloy              = { path = "../alloy" }
axum               = { version = "0.8", features = ["multipart"] }
tokio              = { version = "1", features = ["full"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["trace", "timeout"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
